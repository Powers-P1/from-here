<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}} — FROM HERE</title>
  <link rel="canonical" href="https://powers-p1.github.io{{BASE}}{{SLUG}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FROM HERE">
  <meta property="og:title" content="{{TITLE}} — FROM HERE">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="https://powers-p1.github.io{{BASE}}{{SLUG}}">
  <meta property="og:image" content="https://powers-p1.github.io{{BASE}}assets/share-card.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}} — FROM HERE">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://powers-p1.github.io{{BASE}}assets/share-card.png">
  <meta name="twitter:image:alt" content="KEEP THE EXCEPTION. A clearer A3 sign, with the important details still there.">
  <link rel="icon" href="{{BASE}}assets/corner.svg" type="image/svg+xml">
  <link rel="preload" href="{{BASE}}assets/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{BASE}}assets/site.css">
</head>
<body data-page="{{PAGE}}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{BASE}}" aria-label="FROM HERE home"><img src="{{BASE}}assets/from-here-wordmark.png" width="2176" height="724" alt="FROM HERE"></a>
      <nav aria-label="Product navigation">
        <a data-nav="organisations" href="{{BASE}}organisations/">For organisations</a>
        <a data-nav="readers" href="{{BASE}}readers/">For readers</a>
        <a data-nav="guide" href="{{BASE}}guide/">Guide</a>
        <a data-nav="jury" href="{{BASE}}jury/">For the jury</a>
      </nav>
      <a class="button header-launch" href="{{APP}}" target="_blank" rel="noopener">Open app<span class="sr-only"> (opens a new tab)</span></a>
    </header>
    <main id="main-content">{{CONTENT}}</main>
    <footer class="site-footer">
      <a class="brand" href="{{BASE}}" aria-label="FROM HERE home"><img src="{{BASE}}assets/from-here-wordmark.png" width="2176" height="724" alt="FROM HERE"></a>
      <nav aria-label="Footer navigation"><a href="https://github.com/Powers-P1/from-here">Source code</a><a href="{{BASE}}privacy/">Privacy &amp; limits</a><a href="https://github.com/Powers-P1/from-here/issues">Contact / feedback</a><a href="{{BASE}}jury/">For the jury</a></nav>
    </footer>
  </div>
