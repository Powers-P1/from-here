name: Publish product website
on:
  push:
    branches: [main]
    paths: ['site/**', 'public/brand/**', 'public/samples/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: product-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Build static product website
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
