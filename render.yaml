services:
  - type: web
    name: from-here
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: AI_TEXT_PROVIDER
        value: anthropic
      - key: AI_TEXT_MODEL
        value: claude-sonnet-5-5
      - key: AI_TIMEOUT_MS
        value: '180000'
      - key: PUBLIC_DEMO
        value: '1'
      - key: TRUST_PROXY
        value: '1'
      - key: MAX_JOBS
        value: '8'
      - key: MAX_ACTIVE_JOBS
        value: '2'
      - key: PUBLIC_AI_REQUESTS_PER_DAY
        value: '200'
